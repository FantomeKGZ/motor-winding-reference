name: Validate handbook links

on:
  pull_request:
    paths:
      - 'sourse/**'
      - 'tools/build_scheme_index.py'
      - 'tools/build_home_tables.py'
      - 'tools/build_image_inventory.py'
      - 'tools/build_page_inventory.py'
      - 'tools/build_search_index.py'
      - 'tools/build_scheme_catalog.py'
      - 'tools/repair_scheme_catalog_images.py'
      - 'tools/refine_connection_options.py'
      - 'tools/validate_scheme_catalog.py'
      - 'tools/validate_scheme_catalog_images.py'
      - 'tools/validate_connection_option_images.py'
      - 'tools/audit_page_scoped_connections.py'
      - '.github/workflows/validate-handbook-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate scheme index
        run: |
          python tools/build_scheme_index.py \
            --desktop 'sourse/desktop/Справочник от 09.12.2024 HTML/index.html' \
            --mobile 'sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML/index.html' \
            --output site/shared/data

      - name: Extract original homepage tables
        run: |
          python tools/build_home_tables.py \
            --desktop 'sourse/desktop/Справочник от 09.12.2024 HTML/index.html' \
            --mobile 'sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML/index.html' \
            --output site/shared/data

      - name: Inventory handbook images
        run: |
          python tools/build_image_inventory.py \
            --desktop 'sourse/desktop/Справочник от 09.12.2024 HTML' \
            --mobile 'sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML' \
            --output site/shared/data

      - name: Inventory legacy HTML pages
        run: |
          python tools/build_page_inventory.py \
            --desktop-root 'sourse/desktop/Справочник от 09.12.2024 HTML' \
            --mobile-root 'sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML' \
            --output site/shared/data/page-inventory.json

      - name: Build full-text search indexes
        run: |
          python tools/build_search_index.py \
            --desktop-root 'sourse/desktop/Справочник от 09.12.2024 HTML' \
            --mobile-root 'sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML' \
            --output site/shared/data

      - name: Build CoilMaster scheme catalogs
        run: |
          python tools/build_scheme_catalog.py \
            --desktop-root 'sourse/desktop/Справочник от 09.12.2024 HTML' \
            --mobile-root 'sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML' \
            --output site/shared/data

      - name: Repair marker images in scheme catalogs
        run: |
          python tools/repair_scheme_catalog_images.py \
            site/shared/data/desktop-scheme-catalog.json \
            'sourse/desktop/Справочник от 09.12.2024 HTML' \
            --report site/shared/data/desktop-scheme-catalog-image-repair.json

          python tools/repair_scheme_catalog_images.py \
            site/shared/data/mobile-scheme-catalog.json \
            'sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML' \
            --report site/shared/data/mobile-scheme-catalog-image-repair.json

      - name: Refine connection options
        run: |
          python tools/refine_connection_options.py \
            site/shared/data/desktop-scheme-catalog.json \
            'sourse/desktop/Справочник от 09.12.2024 HTML' \
            --report site/shared/data/desktop-connection-refinement.json

          python tools/refine_connection_options.py \
            site/shared/data/mobile-scheme-catalog.json \
            'sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML' \
            --report site/shared/data/mobile-connection-refinement.json

      - name: Validate scheme catalog layout images
        run: |
          python tools/validate_scheme_catalog_images.py \
            site/shared/data/desktop-scheme-catalog.json

          python tools/validate_scheme_catalog_images.py \
            site/shared/data/mobile-scheme-catalog.json

      - name: Validate connection option images
        run: |
          python tools/validate_connection_option_images.py \
            site/shared/data/desktop-scheme-catalog.json \
            'sourse/desktop/Справочник от 09.12.2024 HTML' \
            --report site/shared/data/desktop-connection-option-image-validation.json

          python tools/validate_connection_option_images.py \
            site/shared/data/mobile-scheme-catalog.json \
            'sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML' \
            --report site/shared/data/mobile-connection-option-image-validation.json

      - name: Audit ambiguous page-scoped connections
        run: |
          python tools/audit_page_scoped_connections.py \
            site/shared/data/desktop-scheme-catalog.json \
            --report site/shared/data/desktop-page-scoped-connection-audit.json

          python tools/audit_page_scoped_connections.py \
            site/shared/data/mobile-scheme-catalog.json \
            --report site/shared/data/mobile-page-scoped-connection-audit.json

      - name: Validate CoilMaster scheme catalogs
        run: |
          python tools/validate_scheme_catalog.py \
            --desktop site/shared/data/desktop-scheme-catalog.json \
            --mobile site/shared/data/mobile-scheme-catalog.json \
            --report site/shared/data/scheme-catalog-validation.json

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handbook-link-reports
          path: site/shared/data/*.json
          if-no-files-found: warn
